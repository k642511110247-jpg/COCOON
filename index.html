    { t: `Chăm sóc tóc bằng tinh dầu bưởi`, b: [`Gội sạch tóc với dầu gội bưởi khi cần. Khi tóc và da đầu khô, sạch, bạn lắc đều nước dưỡng tóc tinh dầu bưởi, thoa lên da đầu và mát-xa nhẹ. Sử dụng sáng và tối theo hướng dẫn sản phẩm.`] }
  ],
  faq: {
    intro: `Làn da đẹp không đến từ việc chăm sóc thật nhiều, mà từ việc thấu hiểu và yêu thương làn da đúng cách.`,
    items: [
      { q: `Bao lâu để làn da cảm nhận được sự thay đổi?`, a: `Mỗi làn da đều có nhịp điệu riêng! Bạn có thể cảm nhận sự sạch thoáng, mềm mại và ẩm mượt ngay sau khi sử dụng một số sản phẩm. Tuy nhiên, những cải thiện về mụn, dầu thừa hay tình trạng tóc gãy rụng cần thời gian và sự kiên trì. Hãy duy trì routine phù hợp và lắng nghe những thay đổi tích cực mỗi ngày.` },
      { q: `Da nhạy cảm có thể sử dụng sản phẩm từ thiên nhiên không?`, a: `Nguồn gốc thiên nhiên không đồng nghĩa với việc phù hợp với tất cả mọi làn da. Bí quyết là lựa chọn sản phẩm theo nhu cầu, tìm hiểu kỹ bảng thành phần và thử trên một vùng da nhỏ trước khi sử dụng. Bởi chăm sóc da cũng là hành trình thấu hiểu chính mình.` },
      { q: `Dùng càng nhiều sản phẩm, hiệu quả càng tốt?`, a: `Không hẳn đâu nhé! Một routine đơn giản nhưng phù hợp đôi khi lại là điều làn da cần nhất. Sử dụng đúng lượng, đúng bước không chỉ giúp chăm sóc da hiệu quả mà còn hạn chế lãng phí. Ít hơn, nhưng đúng hơn, đó mới là bí quyết làm đẹp thông minh!` },
      { q: `Càng nhiều bọt, càng chà mạnh thì da càng sạch?`, a: `Đây là một hiểu lầm khá phổ biến. Làn da không cần được làm sạch bằng lực mạnh mà cần sự dịu dàng. Thay vì chà xát quá mức, hãy mát-xa nhẹ nhàng, sử dụng sản phẩm theo hướng dẫn và rửa sạch đúng cách. Làm sạch là để nâng niu làn da, không phải thử thách sức chịu đựng của da bạn nhé.` }
    ]
  },
  ideas: [
    { t: `Mỗi ngày một việc nhỏ`, b: `Tích dấu cho các hành động bạn tự chọn: sử dụng sản phẩm đúng lượng, tái dùng túi đựng, phân loại vỏ chai.`, go: "#lich" },
    { t: `Thành tựu có thật`, b: `Huy hiệu 7/14/30/100 ngày phản ánh số lần check-in trong hệ thống, bạn có thể lựa chọn biến chúng thành tiền quyên góp cho Hội Phụ nữ hoặc thành voucher nhé.`, go: "#toi" },
    { t: `Điểm nhấn cuối hành trình`, b: `Nhật ký "thói quen đẹp của tôi"; có thể chia sẻ tùy chọn. Bạn có thể chia sẻ nhật kí ấy lên mạng xã hội và bạn bè.`, wr: 1 }
  ]
};
</script>
<script>(function () {
  const C = window.COCOON_CONFIG, T = window.COCOON_CONTENT, E = { pages: {} }, PK = Object.keys(C.products), g = i => document.getElementById(i);
  const e = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const css = document.createElement("style");
  css.textContent = ".sn{position:sticky;top:0;display:flex;overflow-x:auto;gap:8px;background:var(--cr);padding:8px 0;z-index:4}.sn a{white-space:nowrap;padding:8px 14px;border-radius:99px;border:1px solid var(--tw);color:var(--bk);text-decoration:none;min-height:48px;display:flex;align-items:center}.sn a.on{background:var(--ac);font-weight:700}section{scroll-margin-top:72px}.card{background:#fff;border:1px solid #e4dcc9;border-radius:8px;padding:12px 16px;margin:10px 0}.bar{height:14px;background:var(--ac);border-radius:4px;border:1px solid var(--tw)}.f summary{min-height:48px;cursor:pointer;font-weight:700;display:flex;align-items:center}input,select,textarea{font:inherit;min-height:48px;padding:6px 10px;max-width:100%;border:1px solid var(--tw);border-radius:4px;background:#fff}.cols{display:grid;gap:12px}.sn::-webkit-scrollbar{display:none}@media(min-width:900px){.cols{grid-template-columns:1fr 1fr}}";
  document.head.appendChild(css);
  const st = S => { S.pts = S.pts || 0; S.ms = S.ms || []; S.gifts = S.gifts || {}; S.rev = S.rev || []; S.freq = S.freq || {}; S.adm = S.adm || "all"; return S; };
  const CAP = { bidao: 90, thotnot: 30, sen: 100, buoi: 90 }, GRP = { bidao: "mặt", sen: "mặt", thotnot: "cơ thể", buoi: "tóc" };
  const WITH = { bidao: ["Nước tẩy trang bí đao (khi cần)", "Nước sen Hậu Giang", "kem dưỡng"], sen: ["Gel bí đao rửa mặt", "kem dưỡng", "kem chống nắng"], thotnot: ["dưỡng thể"], buoi: ["dầu gội bưởi"] };
  const rate = (S, p) => S.freq[p] || (p === "thotnot" ? .4 : 1);
  const left = (S, p) => Math.ceil(Math.max(0, CAP[p] - (S.chk[p] || []).length) / rate(S, p));
  const GIFT = `Gửi tặng bạn trọn vẹn sự dịu mát từ thiên nhiên Đất Việt. Mong bạn luôn rạng rỡ, tự tin và yêu thương chính mình theo cách trọn vẹn nhất. Chúc bạn một ngày 20/10 thật ngọt ngào!`;
  const giftFor = o => o === "Dịp khác" ? GIFT.replace("một ngày 20/10", "một ngày") : GIFT.replace("20/10", o);
  const ext = n => `<button class="btn2" data-a="ext">${n}</button>`;
  const Q6 = [["Bạn quan tâm nhất điều gì?", [["Da mặt dầu, dễ nổi mụn", { bidao: 3 }], ["Da mặt nhạy cảm, thiếu ẩm", { sen: 3 }], ["Da cơ thể khô sần", { thotnot: 3 }], ["Tóc yếu, dễ gãy rụng", { buoi: 3 }]]],
    ["Da hoặc tóc của bạn thuộc loại nào?", [["Da dầu hoặc hỗn hợp thiên dầu", { bidao: 2 }], ["Da khô, dễ căng", { sen: 2, thotnot: 1 }], ["Da đầu cần được dưỡng", { buoi: 2 }], ["Mình chưa chắc", {}]]],
    ["Da bạn nhạy cảm đến mức nào?", [["Rất dễ phản ứng", { sen: 2 }], ["Thỉnh thoảng", { sen: 1, bidao: 1 }], ["Ít khi", { thotnot: 1, buoi: 1 }]]],
    ["Bạn muốn chăm sóc vùng nào?", [["Mặt", { bidao: 1, sen: 1 }], ["Cơ thể", { thotnot: 2 }], ["Tóc và da đầu", { buoi: 2 }]]],
    ["Mỗi ngày bạn có bao nhiêu thời gian cho việc chăm da?", [["Dưới 5 phút", { bidao: 1 }], ["5 đến 10 phút", { sen: 1 }], ["Hơn 10 phút", { thotnot: 1, buoi: 1 }]]],
    ["Ngân sách của bạn?", [["Tiết kiệm (ít sản phẩm nhất)", { b: 1 }], ["Vừa phải", { b: 2 }], ["Thoải mái", { b: 3 }]]]];

  E.sos = () => '<div class="row"><button class="btn2" data-a="sos">Da mình đang không ổn</button></div>';

  E.pages["san-pham"] = x => {
    const p = x.sp, o = x.C.products[p], S = st(x.S), R = p === "thotnot" ? [T.routine[2]] : p === "buoi" ? [T.routine[3]] : [T.routine[0], T.routine[1]];
    const L = [["s1", "Dành cho ai?"], ["s2", "Công dụng thực tế"], ["s3", "Routine cho người mới"], ["s4", "Có thể bạn chưa biết?"], ["s7", "Ý tưởng: 100 ngày đẹp theo cách của bạn"]];
    const touched = (S.scans[o.lot] || 0) > 0 || (S.chk[p] || []).length > 0;
    const rv = S.rev.filter(r => r.sp === p).concat([{ u: "Người dùng minh họa", s: 5, t: "Đánh giá minh họa: dùng dễ chịu, mình sẽ dùng tiếp.", m: 1 }]);
    return '<header class="ph" style="text-align:left;color:inherit;font-weight:400;padding:10px 0"><h1>' + o.title + '</h1><p class="q">' + o.quote + '</p><p class="chip">' + o.illus + '</p></header><nav class="sn" id="sn" style="position:sticky;bottom:auto;border:0">' + L.map(l => '<a href="javascript:void(0)" data-a="go" data-v="' + l[0] + '">' + l[1] + "</a>").join("") + "</nav>" +
      '<section id="s1"><h2>Dành cho ai?</h2><p>' + o.who + "</p><h4>Phù hợp với</h4><p>" + o.fit + '</p></section><section id="s2"><h2>Công dụng thực tế</h2><div class="cols"><div><h4>Bạn có thể kỳ vọng</h4><p>' + o.expect + '</p><h4 id="ing">' + o.ingLabel + "</h4><p>" + o.ing + '</p></div><div><h4 id="org">Nguồn gốc</h4><p>' + o.origin + "</p><h4>Cách dùng</h4><p>" + o.usage + '</p></div></div><aside class="tip"><h3>' + o.tipLabel + "</h3><p>" + o.tip + '</p></aside><div class="row">' + o.btns.map(b => '<button class="btn2" data-a="' + b.a + '" data-v="' + (b.v || "") + '">' + b.t + "</button>").join("") + "</div></section>" +
      '<section id="s3"><h2>Routine cho người mới</h2>' + R.map(r => '<div class="card"><h3>' + r.t + "</h3>" + r.b.map(l => "<p>" + l + "</p>").join("") + "</div>").join("") + '<h3>Chọn sản phẩm với sự an tâm</h3><p class="soft">' + x.C.safe + "</p></section>" +
      '<section id="s4"><h2>Có thể bạn chưa biết?</h2><p>' + T.faq.intro + "</p>" + T.faq.items.map(f => '<details class="card f"><summary>' + f.q + "</summary><p>" + f.a + "</p></details>").join("") + "</section>" +
      '<section id="s7"><h2>Ý tưởng: 100 ngày đẹp theo cách của bạn</h2>' + T.ideas.map(i => '<div class="card"><h3>' + i.t + "</h3><p>" + i.b + "</p>" + (i.wr ? '<button class="btn2" data-a="wrapped">Xem Cocoon Wrapped</button>' : '<a class="btn2" href="' + i.go + '">Mở</a>') + "</div>").join("") + "</section>" +
      '<section id="rv"><h2>Đánh giá có xác thực</h2>' + rv.map(r => '<div class="card"><b>' + e(r.u) + "</b> " + "★".repeat(r.s) + (r.m ? " <small>(minh họa)</small>" : ' <small>✔ Đã xác thực mua thật</small>') + "<p>" + e(r.t) + "</p></div>").join("") +
      (touched ? '<div class="card"><h3>Viết đánh giá của bạn</h3><p><select id="rs"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select> sao</p><p><textarea id="rt" placeholder="Chia sẻ trải nghiệm của bạn" style="width:100%"></textarea></p><p>Ảnh trước <input type="file" accept="image/*" data-prev="pa"> Ảnh sau <input type="file" accept="image/*" data-prev="pb"></p><div id="pa"></div><div id="pb"></div><button class="btn" data-a="rev-save">Gửi đánh giá</button></div>' : '<p class="soft">Bạn cần chạm chip trên sản phẩm thật để viết đánh giá.</p>') + "</section>";
  };

  E.pages["goi-y"] = x => {
    const S = st(x.S), p = x.sp, o = x.C.products[p], same = PK.filter(k => k !== p && GRP[k] === GRP[p]), lf = left(S, p), res = S.qres;
    return "<h1>Gợi ý cho bạn</h1><h3>Sản phẩm cùng công dụng</h3><p>" + (same.length ? same.map(k => x.C.products[k].name).join(", ") : "Hiện chưa có sản phẩm khác trong cùng nhóm chăm sóc " + GRP[p] + ".") + "</p><h3>Nên dùng kèm</h3><p>" + WITH[p].join(", ") + '.</p><div class="card"><h3>Sắp hết và mua lại</h3><p>' + o.name + ": ước tính còn khoảng " + lf + " ngày dùng (ước tính mẫu, dựa trên số lần chăm da và tần suất dùng bạn chọn).</p>" + (lf <= 14 ? '<p class="soft">Sắp hết rồi, bạn có thể mua lại đúng sản phẩm này.</p>' : "") + '<div class="row">' + ["Website", "Shopee", "Hasaki", "Guardian"].map(n => ext("Mua lại " + o.name + " tại " + n)).join("") + '</div><p>Voucher mẫu: MAU-VOUCHER-xxxx (minh họa)</p></div><h3>Trắc nghiệm nhanh</h3>' +
      Q6.map((q, i) => '<fieldset class="card"><legend>' + q[0] + "</legend>" + q[1].map((a, j) => '<label style="display:flex;gap:8px;min-height:48px;align-items:center"><input type="radio" name="q' + i + '" value="' + j + '">' + a[0] + "</label>").join("") + "</fieldset>").join("") + '<button class="btn" data-a="quiz">Xem routine của mình</button>' +
      (res ? '<div class="card"><h3>Routine tối giản cho bạn</h3>' + res.map(k => "<p><b>" + x.C.products[k].name + ":</b> " + x.C.products[k].who + "</p>").join("") + "</div>" : "");
  };

  E.pages.toi = x => {
    const S = st(x.S), T2 = PK.filter(k => (S.scans[x.C.products[k].lot] || 0) > 0 || (S.chk[k] || []).length);
    return "<h1>Tôi</h1>" + (S.user ? "<p>Xin chào " + e(S.user.n) + " (tài khoản mô phỏng, lưu trên máy này).</p>" : '<div class="card"><p>Bạn chỉ cần tài khoản khi muốn lưu lâu dài hoặc đổi điểm.</p><button class="btn2" data-a="login">Đăng nhập (mô phỏng)</button></div>') +
      '<p>Loại da: <select data-skin><option value="">Chưa chọn</option>' + ["Da dầu", "Da hỗn hợp", "Da khô", "Da nhạy cảm"].map(s => "<option" + (S.skin === s ? " selected" : "") + ">" + s + "</option>").join("") + "</select></p><h2>Tủ mỹ phẩm của tôi</h2>" +
      (T2.length ? T2.map(k => { const o = x.C.products[k], c = S.chk[k] || []; return '<div class="card"><b>' + o.name + "</b><p>Số lần chạm: " + (S.scans[o.lot] || 0) + ". Số ngày đã chăm da: " + c.length + ". Lần gần nhất: " + (c.length ? c.slice().sort().pop() : "chưa có") + ". HSD: " + o.hsd + '.</p><label>Tần suất dùng: <select data-freq="' + k + '"><option value="1">Mỗi ngày</option><option value="0.5"' + (S.freq[k] === .5 ? " selected" : "") + '>3 đến 4 lần/tuần</option><option value="0.2"' + (S.freq[k] === .2 ? " selected" : "") + ">1 đến 2 lần/tuần</option></select></label></div>"; }).join("") : "<p>Chạm chip trên sản phẩm để thêm vào tủ.</p>") +
      "<h2>Điểm của tôi: " + S.pts + '</h2><div class="row">' + [["Voucher mẫu", 50], ["Quà mini mẫu", 120]].map((r, i) => '<button class="btn2" data-a="redeem" data-v="' + i + '">Đổi ' + r[0] + " (" + r[1] + " điểm)</button>").join("") + '</div><div class="card"><h3>Đổi vỏ chai cũ lấy quà</h3><p>Nhập số vỏ bạn đã gom. Theo chương trình năm 2026: 25 vỏ lớn hoặc 60 vỏ nhỏ đổi một sản phẩm Cocoon mới; 10 vỏ lớn hoặc 25 vỏ nhỏ đổi một túi vải, theo thể lệ.</p>Vỏ lớn <input id="vl" type="number" min="0" value="0" style="width:90px"> Vỏ nhỏ <input id="vn" type="number" min="0" value="0" style="width:90px"> <button class="btn2" data-a="vo">Kiểm tra</button><p id="vor"></p></div><button class="btn" data-a="wrapped">Cocoon Wrapped</button>';
  };

  E.pages["qua-tang"] = x => {
    const o = "8/3";
    return '<h1>Quà tặng</h1><div class="card"><p>Dịp: <select data-occ><option>8/3</option><option>20/10</option><option>Dịp khác</option></select></p><p>Sản phẩm: <select id="gp">' + PK.map(k => '<option value="' + k + '">' + x.C.products[k].name + "</option>").join("") + '</select></p><p><input id="gf" placeholder="Tên người tặng" style="width:100%"></p><p><textarea id="gm" style="width:100%;min-height:150px">' + giftFor(o) + '</textarea></p><button class="btn" data-a="gift-make">Tạo mã quà tặng</button><p id="gc"></p></div><div class="card"><h3>Bạn nhận được mã quà?</h3><input id="gi" placeholder="Nhập mã" style="width:150px"> <button class="btn2" data-a="gift-open">Mở quà</button></div>';
  };

  const bars = (rows, f) => rows.map(r => '<p style="margin:4px 0">' + r[0] + " (" + Math.round(r[1] * f) + ')</p><div class="bar" style="width:' + Math.round(r[1] * f / 7) + '%;max-width:100%"></div>').join("");

  let S; try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
  S.chk = S.chk || {}; S.rest = S.rest || {}; S.scans = S.scans || {}; S.off = S.off || 0;
  if (!C.products[sp]) sp = C.products[location.hash.slice(1)] ? location.hash.slice(1) : S.sp;
  if (C.products[sp]) S.sp = sp;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const now = () => { const d = new Date(); d.setDate(d.getDate() + S.off); return d; };
  const key = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const shift = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const parse = k => { const a = k.split("-"); return new Date(+a[0], a[1] - 1, +a[2]); };
  const has = (p, k) => (S.chk[p] || []).includes(k), rest = (p, k) => (S.rest[p] || []).includes(k);
  const msgOf = d => { let h = 0; for (const c of key(d)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return C.messages[h % C.messages.length]; };
  function streakAt(p, d) { let n = 0; while (has(p, key(d)) || rest(p, key(d))) { if (has(p, key(d))) n++; d = shift(d, -1); } return n; }
  function streak(p) { let d = now(); if (!has(p, key(d)) && !rest(p, key(d))) d = shift(d, -1); return streakAt(p, d); }
  const missed = p => (S.chk[p] || []).length && ![0, -1].some(i => { const k = key(shift(now(), i)); return has(p, k) || rest(p, k); });
  const restLeft = p => C.REST_MAX - (S.rest[p] || []).filter(k => k.slice(0, 7) === key(now()).slice(0, 7)).length;

  // Module xác thực riêng: sau này đổi sang chip NTAG 424 DNA chỉ cần thay hàm này.
  const Verify = {
    check(p) { if (S.demoAuth) return S.demoAuth; const l = C.products[p].lot; if (!l) return "unknown"; return (S.scans[l] || 0) >= C.AUTH_THRESHOLD ? "abnormal" : "ok"; },
    count(p) { const l = C.products[p].lot, sk = "scan." + p; try { if (sessionStorage.getItem(sk)) return; sessionStorage.setItem(sk, 1); } catch (e) {} S.sd = S.sd || {}; const td = key(now()); if (S.sd[l] === td) return; S.sd[l] = td; S.scans[l] = (S.scans[l] || 0) + 1; save(); }
  };

  const bag = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8a3 3 0 0 1 6 0M12 11v5M9.5 13.5h5"/></svg>';
  const ctx = () => ({ S, save, C, sp, now, key, shift, has, rest, streak, streakAt, modal, render, shareCard, msgOf, Verify });
  window.COCOON_CTX = ctx;
  const modal = h => { const m = document.createElement("div"); m.className = "modal"; m.setAttribute("role", "dialog"); m.innerHTML = "<div>" + h + '<div class="row"><button class="btn2" data-a="close">Đóng</button></div></div>'; document.body.appendChild(m); };

  function confetti() {
    if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    const b = document.createElement("div"); b.className = "cf";
    for (let i = 0; i < 24; i++) { const s = document.createElement("i"); s.style.cssText = "left:" + Math.random() * 100 + "%;background:" + ["#C5A25D", C.products[sp].accent, "#F3C6D3"][i % 3] + ";animation-delay:" + Math.random() * .4 + "s"; b.appendChild(s); }
    document.body.appendChild(b); setTimeout(() => b.remove(), 2600);
  }

  async function shareCard(msg) {
    const p = C.products[sp]; try { await document.fonts.load("italic 500 56px Vollkorn"); await document.fonts.load("700 80px Quicksand"); } catch (e) {}
    const c = document.createElement("canvas"); c.width = 1080; c.height = 1350; const x = c.getContext("2d");
    x.fillStyle = p.accent; x.fillRect(0, 0, 1080, 1350); x.fillStyle = "#FEFBF4"; x.fillRect(60, 60, 960, 1230);
    x.fillStyle = p.qc; x.textAlign = "center"; x.font = "italic 500 58px Vollkorn, Georgia, serif";
    const lines = []; let l = ""; msg.split(" ").forEach(w => { const t = l ? l + " " + w : w; if (x.measureText(t).width > 800 && l) { lines.push(l); l = w; } else l = t; }); lines.push(l);
    lines.forEach((t, i) => x.fillText(t, 540, 560 - (lines.length * 40) + i * 84));
    x.fillStyle = "#C5A25D"; x.font = "700 40px Quicksand, sans-serif"; x.fillText("the", 540, 1100); x.font = "700 92px Quicksand, sans-serif"; x.fillText("cocoon", 540, 1180);
    x.font = "700 24px Quicksand, sans-serif"; x.fillText("O R I G I N A L   V I E T N A M", 540, 1225);
    c.toBlob(async b => {
      const f = new File([b], "cocoon-thiep.png", { type: "image/png" });
      try { if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; } } catch (e) { return; }
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "cocoon-thiep.png"; a.click();
    });
  }

  function select() {
    return '<h1>Bạn đang cầm sản phẩm nào?</h1><div class="grid">' + Object.keys(C.products).map(k => '<button class="pick" style="background:' + C.products[k].accent + '" data-a="pick" data-v="' + k + '">' + C.products[k].name + "</button>").join("") + "</div>";
  }
  function authCard(p) {
    const s = Verify.check(p), o = C.products[p];
    if (s !== "ok") return '<div class="auth bad"><strong>Sản phẩm có thể không chính hãng</strong><p>' + (s === "abnormal" ? "Chip này đã được quét nhiều lần bất thường." : "Mã này không có trong hệ thống.") + '</p><button class="btn2" data-a="report">Báo cáo sản phẩm</button><p>Hotline: ' + C.HOTLINE + "</p></div>";
    return '<details class="auth"><summary>✔ Chính hãng Cocoon: ' + o.illus.replace(/\.$/, "") + "</summary><dl><dt>Số lô</dt><dd>" + o.lot + "</dd><dt>NSX</dt><dd>" + o.nsx + "</dd><dt>HSD</dt><dd>" + o.hsd + "</dd><dt>Cơ sở sản xuất</dt><dd>" + C.FACTORY + "</dd></dl><small>Dữ liệu minh họa</small></details>";
  }
  function today(p) {
    Verify.count(p); const d = now(), k = key(d), done = has(p, k), rd = rest(p, k), n = streak(p);
    return '<section class="hero"><p class="q">' + msgOf(d) + "</p></section>" +
      '<div class="row">' + (done ? '<p class="ok">Hôm nay bạn đã chăm da rồi. Bạn đã chăm da ' + n + ' ngày liên tiếp.</p>' : rd ? '<p class="ok">Hôm nay là ngày nghỉ phép của bạn.</p>' : '<button class="btn" data-a="checkin">' + bag + "Mình đã chăm da xong</button>") +
      '<button class="btn2" data-a="share">Lưu hoặc chia sẻ thiệp ảnh</button>' +
      (!done && !rd && restLeft(p) > 0 ? '<button class="btn2" data-a="rest">Dùng ngày nghỉ phép (còn ' + restLeft(p) + ")</button>" : "") + "</div>" +
      (missed(p) ? '<p class="soft">' + C.missed + "</p>" : "") + authCard(p) + (X().sos ? X().sos() : "");
  }
  function lich(p) {
    const d = now(), y = d.getFullYear(), mo = d.getMonth(), len = new Date(y, mo + 1, 0).getDate(), off = (new Date(y, mo, 1).getDay() + 6) % 7; let cells = "";
    for (let i = 0; i < off; i++) cells += "<i></i>";
    for (let i = 1; i <= len; i++) { const k = key(new Date(y, mo, i)); cells += '<button class="day' + (has(p, k) ? " on" : "") + (rest(p, k) ? " rs" : "") + (k === key(d) ? " td" : "") + '" data-a="day" data-v="' + k + '" aria-label="Ngày ' + i + '">' + i + "</button>"; }
    return "<h1>Tháng " + (mo + 1) + "/" + y + "</h1><p>Bạn đã chăm da " + streak(p) + ' ngày liên tiếp. Bấm vào một ngày để xem lời chúc. Ô nền màu là ngày đã chăm da, ô viền đứt là ngày nghỉ phép.</p><div class="cal">' + ["T2", "T3", "T4", "T5", "T6", "T7", "CN"].map(t => "<b>" + t + "</b>").join("") + cells + "</div>";
  }
  function sanpham(p) {
    const o = C.products[p];
    return '<header class="ph" style="text-align:left;color:inherit;font-weight:400;padding:10px 0"><h1>' + o.title + '</h1><p class="q">' + o.quote + '</p><p class="chip">' + o.illus + "</p></header>" +
      '<div class="two"><div><h2>Dành cho ai?</h2><p>' + o.who + "</p><h4>Phù hợp với</h4><p>" + o.fit + "</p><h2>Công dụng thực tế</h2><h4>Bạn có thể kỳ vọng</h4><p>" + o.expect + '</p></div><div><h4 id="ing">' + o.ingLabel + "</h4><p>" + o.ing + '</p><h4 id="org">Nguồn gốc</h4><p>' + o.origin + "</p><h4>Cách dùng</h4><p>" + o.usage + '</p><aside class="tip"><h3>' + o.tipLabel + "</h3><p>" + o.tip + "</p></aside></div></div>" +
      '<div class="row">' + o.btns.map(b => '<button class="btn2" data-a="' + b.a + '" data-v="' + (b.v || "") + '">' + b.t + "</button>").join("") + '</div><p class="soft">' + C.safe + "</p>";
  }

  function render() {
    const nav = $("#nav"), v = $("#v");
    if (!C.products[sp]) sp = "bidao";
    const p = C.products[sp], r = location.hash.replace(/^#\/?/, "") || "hom-nay";
    document.documentElement.style.setProperty("--ac", p.accent); document.documentElement.style.setProperty("--qc", p.qc);
    const tabs = [["hom-nay", "Hôm nay"], ["lich", "Lịch"], ["san-pham", "Sản phẩm"], ["goi-y", "Gợi ý"], ["toi", "Tôi"]];
    nav.innerHTML = tabs.map(t => '<a href="#' + t[0] + '"' + (t[0] === r ? ' class="on"' : "") + ">" + t[1] + "</a>").join("");
    const PG = X().pages || {}, ex = PG[r] || (C.products[r] ? PG["hom-nay"] : r === "lich" ? null : PG._); v.innerHTML = ex ? ex(ctx()) : r === "lich" ? lich(sp) : today(sp); if (X().after) X().after(r, ctx());
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-a]"); if (!t) return; const a = t.dataset.a, v = t.dataset.v, p = sp && C.products[sp] ? sp : null;
    if (a === "close") t.closest(".modal").remove();
    else if (a === "pick") location.hash = "#" + v;
    else if (a === "checkin") {
      const k = key(now()); (S.chk[p] = S.chk[p] || []).push(k); save(); render(); confetti();
      const n = streak(p); if (X().onCheckin) X().onCheckin(p, n, ctx()); if (C.milestones[n]) modal('<h2>Mốc ' + n + ' ngày</h2><p class="q">' + C.milestones[n] + "</p>");
    } else if (a === "rest") { (S.rest[p] = S.rest[p] || []).push(key(now())); save(); render(); }
    else if (a === "share") shareCard(msgOf(now()));
    else if (a === "day") { const d = parse(v), n = has(p, v) ? streakAt(p, d) : 0; modal("<h3>" + d.getDate() + "/" + (d.getMonth() + 1) + '</h3><p class="q">' + msgOf(d) + "</p>" + (has(p, v) ? "<p>Ngày này bạn đã chăm da.</p>" : "") + (C.milestones[n] ? '<p class="soft">' + C.milestones[n] + "</p>" : "")); }
    else if (a === "video") modal('<div class="vid">▶</div><p>Video minh họa</p>');
    else if (a === "steps") modal("<h3>3 bước dùng đúng</h3><ol>" + C.products[p].steps.map(s => "<li>" + s + "</li>").join("") + "</ol>");
    else if (a === "go") { const el = document.getElementById(v); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth" }); }
    else if (a === "report") modal('<h3>Báo cáo sản phẩm</h3><textarea placeholder="Mô tả nơi bạn mua và điều bạn thấy lạ"></textarea><div class="row"><button class="btn" data-a="sent">Gửi báo cáo</button></div><p>Hotline: ' + C.HOTLINE + "</p>");
    else if (a === "sent") t.closest(".modal > div").innerHTML = '<p>Cảm ơn bạn, nhóm đã nhận báo cáo (mô phỏng).</p><button class="btn2" data-a="close">Đóng</button>';
    else if (a === "d-auth") { S.demoAuth = v || null; save(); render(); }
    else if (a === "d-day") { S.off += 1; save(); render(); }
    else if (a === "d-miss") { S.off += 2; save(); render(); }
    else if (a === "d-ms") { const n = +v, d = now(), k = key(d); S.chk[p] = (S.chk[p] || []).filter(x => x !== k); for (let i = 1; i < n; i++) { const x = key(shift(d, -i)); if (!S.chk[p].includes(x)) S.chk[p].push(x); } save(); render(); }
    else if (a === "d-clear") { S = { chk: {}, rest: {}, scans: {}, off: 0 }; save(); try { sessionStorage.clear(); } catch (e) {} render(); }
    else if (a === "d-sp") location.hash = "#" + v;
    else if (X().act) X().act(a, v, t, ctx());
  });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (C.products[h]) { sp = h; S.sp = h; save(); } render(); window.scrollTo(0, 0); });

  if (demo) {
    const d = $("#demo"); d.hidden = false;
    d.innerHTML = '<details><summary>Bảng demo</summary>' + Object.keys(C.products).map(k => '<button data-a="d-sp" data-v="' + k + '">' + C.products[k].name.split(" ")[0] + "</button>").join("") +
      '<br><button data-a="d-auth" data-v="">Chính hãng</button><button data-a="d-auth" data-v="abnormal">Quét bất thường</button><button data-a="d-auth" data-v="unknown">Mã không có</button><br><button data-a="d-day">Qua 1 ngày</button><button data-a="d-miss">Lỡ 1 ngày</button><br>' +
      [7, 14, 30, 100].map(n => '<button data-a="d-ms" data-v="' + n + '">Mốc ' + n + "</button>").join("") + '<br><button data-a="d-wrapped">Thử Wrapped</button><button data-a="d-gift">Quà tặng (người nhận)</button><br><button data-a="d-admin">Admin</button><button data-a="d-clear">Xóa dữ liệu</button></details>';
  }
  render();
})();
</script>

</body>
